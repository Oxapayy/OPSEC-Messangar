name: OPSECMessenger
options:
  bundleIdPrefix: com.opsec
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Tor:
    url: https://github.com/iCepa/Tor.framework.git
    from: "408.16.0"

targets:
  OPSECMessenger:
    type: application
    platform: iOS
    sources:
      - path: OPSECMessenger
    resources:
      - path: OPSECMessenger/Resources
    info:
      path: OPSECMessenger/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opsec.messenger
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: "-ObjC"
    dependencies:
      - package: Tor
        product: Tor
