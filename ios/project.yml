name: OPSECMessenger
options:
  bundleIdPrefix: com.opsec
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # TODO: set your Apple developer team ID
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  OPSECMessenger:
    type: application
    platform: iOS
    sources:
      - path: OPSECMessenger
    resources:
      - path: OPSECMessenger/Resources
    info:
      path: OPSECMessenger/Resources/Info.plist
      properties:
        CFBundleDisplayName: OPSEC
        UILaunchScreen: {}
        NSCameraUsageDescription: "Used for video calls and sending photos."
        NSMicrophoneUsageDescription: "Used for voice and video calls."
        NSPhotoLibraryUsageDescription: "Used to attach images to messages."
        UIBackgroundModes:
          - voip
          - remote-notification
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opsec.messenger
        TARGETED_DEVICE_FAMILY: "1,2"
    # To enable Tor: uncomment after adding the package in Xcode.
    # dependencies:
    #   - package: TorFramework
    #     product: Tor
    #
    # packages:
    #   TorFramework:
    #     url: https://github.com/iCepa/Tor.framework
    #     from: 408.16.0
