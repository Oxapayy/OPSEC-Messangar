name: OPSECMessenger
options:
  bundleIdPrefix: com.opsec
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.4"
    CURRENT_PROJECT_VERSION: "6"

targets:
  OPSECMessenger:
    type: application
    platform: iOS
    sources:
      - path: OPSECMessenger
    resources:
      - path: OPSECMessenger/Resources
    # IMPORTANT: no `info:` block here. XcodeGen's `info.path` REGENERATES
    # the plist on every `xcodegen generate`, silently overwriting our
    # handcrafted Info.plist (ATS policy, launch storyboard, usage strings).
    # INFOPLIST_FILE makes Xcode consume the checked-in file as-is.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opsec.messenger
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: "-ObjC"
        INFOPLIST_FILE: OPSECMessenger/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
    # Tor.framework is pulled via CocoaPods — see ios/Podfile.
