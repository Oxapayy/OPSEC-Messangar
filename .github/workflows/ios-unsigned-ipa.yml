name: iOS unsigned .ipa

on:
  workflow_dispatch: {}
  push:
    branches: [main, "claude/**"]
    paths:
      - "ios/**"
      - ".github/workflows/ios-unsigned-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Select newest available Xcode
        run: |
          ls /Applications | grep -i "^Xcode" || true
          sudo xcode-select -s /Applications/Xcode.app

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
          ruby --version
          pod --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Install CocoaPods
        working-directory: ios
        run: |
          pod repo update --silent
          pod install --repo-update

      - name: Build (unsigned) archive
        working-directory: ios
        run: |
          xcodebuild \
            -workspace OPSECMessenger.xcworkspace \
            -scheme OPSECMessenger \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/OPSECMessenger.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package .ipa (unsigned)
        working-directory: ios
        run: |
          rm -rf build/Payload
          mkdir build/Payload
          cp -R build/OPSECMessenger.xcarchive/Products/Applications/OPSECMessenger.app \
                build/Payload/
          cd build
          zip -qry OPSECMessenger-unsigned.ipa Payload
          ls -lh OPSECMessenger-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: OPSECMessenger-unsigned-ipa
          path: ios/build/OPSECMessenger-unsigned.ipa
          if-no-files-found: error
